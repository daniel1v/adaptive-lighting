[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-lighting"
version = "1.30.2"
description = "Automatically adjust brightness and color of lights based on the sun position"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"

[dependency-groups]
docs = [
    "astral",
    "homeassistant",
    "markdown-code-runner>=2.7.0",
    "markdown-gfm-admonition",
    "pandas",
    "shinylive",
    "tabulate",
    "ulid-transform",
    "voluptuous",
    "zensical",
]
dev = [
    "mypy",
    "pre-commit",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/adaptive_lighting"]

# NOTE: ruff is configured in .ruff.toml, which takes precedence over any
# [tool.ruff] section here. Do not add ruff settings to this file.

[tool.black]
# Pin the target so black does not infer a newer Python than we support and
# then fail its own AST safety check. Oldest supported HA Core (2024.12) is 3.12.
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
